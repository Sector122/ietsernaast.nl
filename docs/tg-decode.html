<!doctype html>
<!-- Telegram attribution decoder. Open locally in any browser (not deployed).

     Paste a received Telegram message; the tool extracts the invisible
     zero-width payload stamped by the site (lib/analytics/tg-payload.ts) and
     prints the 16-hex visitor token. Look the visitor up in Mixpanel with:
     click_id starts with <token>.

     Decoding logic mirrors lib/analytics/tg-payload.ts - keep them in sync. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Telegram attribution decoder</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.2rem; }
  textarea { width: 100%; min-height: 8rem; font: inherit; padding: .6rem; box-sizing: border-box; }
  #out { margin-top: 1rem; padding: .8rem 1rem; border-radius: 8px; background: #f4f4f5; white-space: pre-wrap; }
  #out.ok { background: #e7f6ec; }
  #out.bad { background: #fdecea; }
  code { background: #e8e8ea; padding: 0 .3em; border-radius: 4px; }
</style>
</head>
<body>
<h1>Telegram attribution decoder</h1>
<p>Paste the full received message (copy it straight from Telegram — copying preserves the invisible characters):</p>
<textarea id="in" autofocus spellcheck="false"></textarea>
<div id="out">Waiting for input…</div>

<script>
"use strict";

var ALPHABET = ["\u200B", "\u2060", "\u2062", "\u2063"]; // ZWSP WJ INVISIBLE-TIMES INVISIBLE-SEP
var TOKEN_CHARS = 32, CHECKSUM_CHARS = 8;
var PAYLOAD_CHARS = TOKEN_CHARS + CHECKSUM_CHARS;

function checksum16(token) {
  var hash = 0x811c9dc5;
  for (var i = 0; i < token.length; i++) {
    hash ^= token.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  hash >>>= 0;
  return (hash >>> 16) ^ (hash & 0xffff);
}

function decodePayload(text) {
  var digitOf = {};
  ALPHABET.forEach(function (c, i) { digitOf[c] = i; });

  var runs = [], run = [];
  for (var ch of text) {
    if (digitOf[ch] !== undefined) {
      run.push(digitOf[ch]);
    } else if (run.length) {
      runs.push(run); run = [];
    }
  }
  if (run.length) runs.push(run);

  var corrupted = null;
  for (var r of runs) {
    for (var start = 0; start + PAYLOAD_CHARS <= r.length; start++) {
      var token = "";
      for (var i = 0; i < TOKEN_CHARS; i += 2) {
        token += ((r[start + i] << 2) | r[start + i + 1]).toString(16);
      }
      var sum = 0;
      for (var j = 0; j < CHECKSUM_CHARS; j++) {
        sum = (sum << 2) | r[start + TOKEN_CHARS + j];
      }
      if (sum === checksum16(token)) return { token: token, valid: true };
      if (!corrupted) corrupted = { token: token, valid: false };
    }
  }
  return corrupted;
}

var input = document.getElementById("in");
var out = document.getElementById("out");

input.addEventListener("input", function () {
  var text = input.value;
  out.className = "";
  if (!text.trim()) { out.textContent = "Waiting for input…"; return; }

  var zw = 0;
  for (var ch of text) if (ALPHABET.indexOf(ch) !== -1) zw++;

  var result = decodePayload(text);
  if (!result) {
    out.className = "bad";
    out.textContent =
      "No payload found (" + zw + " zero-width chars in text, need " +
      PAYLOAD_CHARS + " contiguous).\n" +
      "The sender's client may have stripped them, or the user deleted the draft.";
  } else if (result.valid) {
    out.className = "ok";
    out.innerHTML =
      "Token: <code>" + result.token + "</code> (checksum OK)\n\n" +
      "Mixpanel lookup: any event where <code>click_id</code> starts with the token.";
  } else {
    out.className = "bad";
    out.innerHTML =
      "Payload found but checksum FAILED — best-guess token: <code>" +
      result.token + "</code>\n\n" +
      "Some characters were lost or reordered in transit; treat the token as unreliable.";
  }
});
</script>
</body>
</html>
